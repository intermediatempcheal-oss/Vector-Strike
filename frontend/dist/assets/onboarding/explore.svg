<svg xmlns="http://www.w3.org/2000/svg" width="420" height="300" viewBox="0 0 420 300" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="sky2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#172554"/>
      <stop offset="1" stop-color="#0b1124"/>
    </linearGradient>
    <linearGradient id="ring2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#a855f7" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="planet2" cx="0.35" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#7dd3fc"/>
      <stop offset="0.45" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#0b1238"/>
    </radialGradient>
  </defs>
  <rect width="420" height="300" rx="26" fill="url(#sky2)"/>
  <g fill="#dbeafe" opacity="0.8">
    <circle cx="50" cy="50" r="1.4"/><circle cx="150" cy="30" r="1"/>
    <circle cx="260" cy="55" r="1.5"/><circle cx="370" cy="90" r="1.2"/>
    <circle cx="330" cy="170" r="1.2"/><circle cx="90" cy="130" r="1.1"/>
  </g>
  <!-- astronaut-ish planet exploration visual -->
  <g transform="translate(210,150)">
    <ellipse cx="0" cy="0" rx="95" ry="86" fill="url(#planet2)"/>
    <circle cx="-34" cy="-32" r="16" fill="#93c5fd" opacity="0.3"/>
    <circle cx="30" cy="16" r="11" fill="#60a5fa" opacity="0.24"/>
    <ellipse cx="0" cy="0" rx="140" ry="22" fill="none" stroke="url(#ring2)" stroke-width="9" transform="rotate(-16)"/>
  </g>
  <path d="M58 240 h60" stroke="#22d3ee" stroke-width="2" opacity="0.7"/>
  <path d="M300 260 h66" stroke="#a855f7" stroke-width="2" opacity="0.6"/>
</svg>