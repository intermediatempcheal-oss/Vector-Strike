<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a1128"/>
      <stop offset="0.5" stop-color="#0b1024"/>
      <stop offset="1" stop-color="#070b18"/>
    </linearGradient>
    <radialGradient id="nebulaA" cx="0.22" cy="0.15" r="0.6">
      <stop offset="0" stop-color="#6366f1" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="nebulaB" cx="0.85" cy="0.25" r="0.55">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="nebulaC" cx="0.55" cy="0.95" r="0.7">
      <stop offset="0" stop-color="#a855f7" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#a855f7" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="planet" cx="0.35" cy="0.3" r="0.75">
      <stop offset="0" stop-color="#7dd3fc"/>
      <stop offset="0.4" stop-color="#1d4ed8"/>
      <stop offset="1" stop-color="#0b1238"/>
    </radialGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#22d3ee" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#a855f7" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="floor" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0" stop-color="#1e1b4b" stop-opacity="0"/>
      <stop offset="1" stop-color="#312e81" stop-opacity="0.55"/>
    </linearGradient>
    <filter id="blur1" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="46"/>
    </filter>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2.4"/>
    </filter>
  </defs>

  <rect width="1280" height="800" fill="url(#bg)"/>
  <rect width="1280" height="800" fill="url(#nebulaA)"/>
  <rect width="1280" height="800" fill="url(#nebulaB)"/>
  <rect width="1280" height="800" fill="url(#nebulaC)"/>

  <!-- stars -->
  <g fill="#dbeafe">
    <circle cx="120" cy="90" r="1.6" opacity="0.9"/>
    <circle cx="320" cy="60" r="1.1" opacity="0.7"/>
    <circle cx="560" cy="140" r="1.4" opacity="0.8"/>
    <circle cx="760" cy="70" r="1.2" opacity="0.75"/>
    <circle cx="980" cy="120" r="1.8" opacity="0.9"/>
    <circle cx="1120" cy="200" r="1.1" opacity="0.7"/>
    <circle cx="210" cy="240" r="1.2" opacity="0.6"/>
    <circle cx="430" cy="210" r="1" opacity="0.7"/>
    <circle cx="885" cy="58" r="1.3" opacity="0.8"/>
    <circle cx="1180" cy="80" r="1.5" opacity="0.9"/>
    <circle cx="48" cy="420" r="1.2" opacity="0.6"/>
    <circle cx="1230" cy="330" r="1.4" opacity="0.7"/>
    <circle cx="680" cy="330" r="1" opacity="0.6"/>
    <circle cx="70" cy="600" r="1.1" opacity="0.5"/>
  </g>

  <!-- planet with ring, upper right -->
  <g transform="translate(980,210)">
    <circle cx="0" cy="0" r="150" fill="none" stroke="url(#ring)" stroke-width="14" transform="rotate(-18)" opacity="0.85" filter="url(#soft)"/>
    <circle cx="0" cy="0" r="128" fill="url(#planet)" opacity="0.95"/>
    <circle cx="-40" cy="-45" r="26" fill="#93c5fd" opacity="0.25"/>
    <circle cx="35" cy="20" r="16" fill="#60a5fa" opacity="0.2"/>
  </g>

  <!-- drifting comet streaks -->
  <g stroke="#a5f3fc" stroke-width="2" opacity="0.35" filter="url(#soft)">
    <line x1="150" y1="110" x2="380" y2="250"/>
    <line x1="1150" y1="560" x2="930" y2="700"/>
  </g>

  <!-- perspective floor -->
  <path d="M0 640 L1280 640 L1280 800 L0 800 Z" fill="url(#floor)"/>
  <g stroke="#6366f1" stroke-width="1.4" opacity="0.28">
    <line x1="640" y1="640" x2="-260" y2="900"/>
    <line x1="640" y1="640" x2="1540" y2="900"/>
    <line x1="640" y1="640" x2="-60" y2="900"/>
    <line x1="640" y1="640" x2="1340" y2="900"/>
  </g>
  <g stroke="#22d3ee" stroke-width="1.2" opacity="0.4">
    <line x1="0" y1="664" x2="1280" y2="664"/>
    <line x1="0" y1="706" x2="1280" y2="706"/>
    <line x1="0" y1="756" x2="1280" y2="756"/>
  </g>
</svg>