<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1128"/>
      <stop offset="1" stop-color="#070b18"/>
    </linearGradient>
    <radialGradient id="glowL" cx="0" cy="0.5" r="0.7">
      <stop offset="0" stop-color="#6366f1" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowR" cx="1" cy="0.7" r="0.75">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.5" cy="1" r="0.9">
      <stop offset="0" stop-color="#a855f7" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#a855f7" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
  </defs>

  <rect width="1280" height="800" fill="url(#bg)"/>
  <rect width="1280" height="800" fill="url(#glowL)"/>
  <rect width="1280" height="800" fill="url(#glowR)"/>
  <rect width="1280" height="800" fill="url(#glowB)"/>

  <!-- floating translucent polygons -->
  <g fill="none" stroke-width="1.6">
    <polygon points="180,260 260,180 340,240 300,330 200,320" stroke="#818cf8" opacity="0.35" filter="url(#soft)"/>
    <polygon points="1050,420 1160,380 1190,480 1100,530 1030,470" stroke="#67e8f9" opacity="0.3" filter="url(#soft)"/>
    <polygon points="760,560 820,510 880,560 840,620 770,620" stroke="#c084fc" opacity="0.3" filter="url(#soft)"/>
    <polygon points="90,700 150,650 210,690 170,750 100,740" stroke="#38bdf8" opacity="0.25" filter="url(#soft)"/>
    <polygon points="1120,120 1180,80 1240,120 1210,180 1140,180" stroke="#f472b6" opacity="0.2" filter="url(#soft)"/>
  </g>

  <!-- stars -->
  <g fill="#e0e7ff">
    <circle cx="140" cy="120" r="1.3"/>
    <circle cx="420" cy="90" r="1"/>
    <circle cx="690" cy="150" r="1.4"/>
    <circle cx="920" cy="80" r="1.1"/>
    <circle cx="1150" cy="280" r="1.3"/>
    <circle cx="340" cy="420" r="1.1"/>
    <circle cx="600" cy="300" r="1.2"/>
    <circle cx="860" cy="230" r="0.9"/>
    <circle cx="80" cy="480" r="1.1"/>
    <circle cx="1240" cy="540" r="1.2"/>
  </g>

  <!-- concentric ring accents -->
  <g fill="none" stroke="#8b5cf6" stroke-width="1.2" opacity="0.22">
    <circle cx="1150" cy="150" r="90"/>
    <circle cx="1150" cy="150" r="150"/>
  </g>
</svg>